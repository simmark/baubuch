# Hält das kostenlose Supabase-Projekt wach (pausiert sonst nach 7 Tagen ohne Datenbankzugriff) und das
# Repository aktiv (GitHub schaltet zeitgesteuerte Abläufe in öffentlichen Repositories nach 60 Tagen ohne Aktivität ab).
# Einstellungen › Secrets and variables › Actions › Variables: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY (beide öffentlich).
name: Wachhalten
on:
  schedule: [{ cron: '17 6,18 * * *' }]   # zweimal täglich
  workflow_dispatch:
permissions: { contents: write }
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anpingen
        run: |
          curl -fsS -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/bb_ping" -H "apikey: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}" -H "Content-Type: application/json" -d '{}'
      - uses: actions/checkout@v4
      - name: Repository aktiv halten (einmal im Monat)
        run: |
          if [ "$(date +%d)" = "01" ] && [ "$(date +%H)" -lt 12 ]; then
            date -u +%Y-%m-%dT%H:%MZ > wachhalten.txt
            git config user.name "baubuch-bot"; git config user.email "baubuch-bot@users.noreply.github.com"
            git add wachhalten.txt && git commit -m "Wachhalten" && git push || true
          fi
